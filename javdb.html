  <style>
    :root {
      color-scheme: dark;
      --panel-rgb: 26, 26, 46;
      --panel: rgba(var(--panel-rgb), .78);
      --panel-soft: rgba(var(--panel-rgb), .58);
      --panel-strong: rgba(var(--panel-rgb), .9);
      --text: #f0f0f5;
      --muted: rgba(210, 210, 230, .72);
      --line: rgba(255, 255, 255, .15);
      --line-strong: rgba(255, 255, 255, .28);
      --control: rgba(40, 40, 65, .55);
      --control-active: rgba(60, 60, 95, .65);
      --accent: #e85d75;
      --accent-2: #ff6b6b;
      --focus-line: rgba(232, 93, 117, .8);
      --focus-glow: rgba(232, 93, 117, .25);
      --ok: #7ecb8a;
      --magnet-color: #5dade2;
      --shadow: 0 12px 36px rgba(0, 0, 0, .3);
      --radius: 8px;
      --fm-web-height: 100vh;
      --fm-safe-top: 0px;
      --fm-safe-right: 0px;
      --fm-safe-bottom: 20px;
      --fm-safe-left: 0px;
      --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
      --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
      --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
      --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @supports (height: 100dvh) {
      :root { --fm-web-height: 100dvh; }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: var(--fm-web-height);
      background: transparent;
      color: var(--text);
      overflow-x: hidden;
    }
    html:not(.fm-native),
    html:not(.fm-native) body {
      background-color: #1a1a2e;
    }
    html.fm-native,
    html.fm-native body {
      background: transparent;
    }
    body {
      overflow-x: hidden;
      letter-spacing: 0;
      position: relative;
      overscroll-behavior-x: none;
    }
    button, input, select {
      font: inherit;
      color: inherit;
    }
    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      text-align: inherit;
    }
    img {
      display: block;
      max-width: 100%;
      background: transparent;
    }
    .app {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: var(--fm-web-height);
      overflow-x: hidden;
      padding: max(12px, var(--safe-top)) 12px calc(18px + var(--safe-bottom));
      background: transparent;
    }
    body.detail-active .app {
      visibility: hidden;
      pointer-events: none;
    }
    .search-bar {
      width: 100%;
      min-width: 0;
      display: flex;
      gap: 8px;
      margin: 4px 0 10px;
      position: relative;
      z-index: 20;
    }
    html.no-layout-gap .search-bar > * { margin-right: 8px; }
    html.no-layout-gap .search-bar > *:last-child { margin-right: 0; }
    .search-bar .field {
      flex: 1 1 auto;
      min-width: 0;
    }
    .search-bar .icon-btn {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
    }
    .field {
      width: 100%;
      min-height: 44px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--control);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      backdrop-filter: blur(10px) saturate(1.05);
    }
    .field::placeholder { color: rgba(210, 210, 230, .45); }
    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      backdrop-filter: blur(10px) saturate(1.05);
    }
    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .chips {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 0 4px;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    html.no-layout-gap .chips > * { margin-right: 7px; }
    html.no-layout-gap .chips > *:last-child { margin-right: 0; }
    .chip {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      backdrop-filter: blur(10px) saturate(1.05);
    }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent-2);
      color: #fff;
    }
    .chip:focus {
      outline: 2px solid var(--focus-line);
      outline-offset: 2px;
    }
    .section {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin-top: 16px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    html.no-layout-gap .section-head > * { margin-right: 10px; }
    html.no-layout-gap .section-head > *:last-child { margin-right: 0; }
    .section-head h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }
    .section-head span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    /* ===== 视频卡片：单列布局 ===== */
    .media-grid {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    html.no-layout-gap .media-grid > * { margin-bottom: 8px; }

    .card {
      width: 100%;
      max-width: none;
      position: relative;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      overflow: hidden;
      padding: 0;
      text-align: left;
      color: var(--text);
      backdrop-filter: blur(10px) saturate(1.05);
    }
    .card:focus {
      outline: 2px solid var(--focus-line);
      outline-offset: -2px;
    }

    .card .poster {
      width: 100%;
      height: auto;
      display: block;
      background: #0d0d1a;
    }

    html.no-aspect-ratio .card .poster {
      height: auto;
      padding-top: 0;
    }
    html.no-aspect-ratio .card .poster-wrap {
      position: relative;
      overflow: hidden;
    }
    html.no-aspect-ratio .card .poster-wrap img {
      position: static;
      width: 100%;
      height: auto;
    }

    .card-body {
      padding: 8px 10px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    .card-title {
      font-size: 11px;
      font-weight: 760;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    html.no-layout-gap .card-meta > * { margin-right: 4px; }
    html.no-layout-gap .card-meta > *:last-child { margin-right: 0; }
    .card-meta:empty { display: none; }
    .rating-badge {
      position: absolute;
      right: 6px;
      top: 6px;
      min-width: 30px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(0,0,0,.5);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(6px);
    }
    .magnet-badge {
      position: absolute;
      left: 6px;
      top: 6px;
      min-height: 20px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(93,173,226,.35);
      border: 1px solid rgba(93,173,226,.5);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(6px);
    }
    .empty {
      min-height: 80px;
      display: grid;
      place-items: center;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px dashed var(--line);
      color: var(--muted);
      background: rgba(255,255,255,.03);
      font-size: 13px;
      text-align: center;
    }
    .loading {
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      font-size: 13px;
    }
    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 16px 0;
    }
    html.no-layout-gap .pagination > * { margin-right: 8px; }
    html.no-layout-gap .pagination > *:last-child { margin-right: 0; }
    .btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      border-radius: var(--radius);
      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 760;
      font-size: 13px;
      text-decoration: none;
      backdrop-filter: blur(10px) saturate(1.05);
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent-2);
      color: #fff;
    }
    .btn.small {
      min-height: 30px;
      padding: 0 10px;
      font-size: 11px;
    }
    .btn:focus {
      outline: 2px solid var(--focus-line);
      outline-offset: 1px;
    }
    .btn:disabled {
      opacity: .5;
    }
    .sheet {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 60;
      width: 100%;
      min-height: var(--fm-web-height);
      background: rgba(10,10,25,.94);
      overflow-y: auto;
      overflow-x: hidden;
      padding: max(14px, var(--safe-top)) 14px calc(22px + var(--safe-bottom));
      backdrop-filter: blur(14px) saturate(1.08);
    }
    .sheet.active { display: block; }
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius);
      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }
    .detail-back:focus {
      outline: 2px solid var(--focus-line);
      outline-offset: 1px;
    }
    .detail-hero {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    html.no-layout-gap .detail-hero > * { margin-right: 12px; }
    html.no-layout-gap .detail-hero > *:last-child { margin-right: 0; }
    .detail-poster {
      flex: 0 0 120px;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .detail-poster img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }
    html.no-aspect-ratio .detail-poster img {
      height: auto;
      min-height: 180px;
    }
    .detail-info {
      flex: 1 1 auto;
      min-width: 0;
    }
    .detail-info h3 {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.3;
    }
    .detail-info .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    html.no-layout-gap .detail-info .meta-row > * { margin-right: 6px; }
    html.no-layout-gap .detail-info .meta-row > *:last-child { margin-right: 0; }
    .detail-info .meta-row span {
      font-size: 12px;
      color: var(--muted);
    }
    .magnet-list {
      width: 100%;
    }
    .magnet-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      margin-bottom: 8px;
      backdrop-filter: blur(8px);
    }
    html.no-layout-gap .magnet-item > * { margin-right: 8px; }
    html.no-layout-gap .magnet-item > *:last-child { margin-right: 0; }
    .magnet-info {
      flex: 1 1 auto;
      min-width: 0;
    }
    .magnet-name {
      font-size: 12px;
      font-weight: 760;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .magnet-meta {
      font-size: 11px;
      color: var(--muted);
    }
    .magnet-play {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 12px;
      border-radius: var(--radius);
      background: var(--magnet-color);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .magnet-play:focus {
      outline: 2px solid #fff;
      outline-offset: 1px;
    }
    .status-bar {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 0;
    }
    html.tv-mode .media-grid {
      overflow: visible;
      padding: 8px 4px 12px;
    }
    html.tv-mode .card {
      transition: transform .1s ease;
    }
    html.tv-mode .card:focus {
      transform: translateY(-2px);
    }

    /* ===== Cookie 弹窗样式 ===== */
    .cookie-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .cookie-overlay.active { display: flex; }
    .cookie-modal {
      background: #2a2a4a;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      border: 1px solid var(--line);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .cookie-modal h3 {

      function apiRequest(path, params) {
        var url = API_HOST + path;
        var qs = [];
        if (params) {
          Object.keys(params).forEach(function (k) {
            var v = params[k];
            if (v !== undefined && v !== null && String(v) !== "") {
              qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(String(v)));
            }
          });
        }
        if (qs.length) url += (url.indexOf("?") >= 0 ? "&" : "?") + qs.join("&");
        log("apiRequest", url);
        var headers = buildApiHeaders();
        var fm = sdk();
        var p;
        if (fm && fm.req) {
          p = fm.req(url, { headers: headers, timeout: 20000 }).then(function (resp) {
            if (!resp || !resp.ok) throw new Error("API HTTP " + (resp ? resp.status : "no response"));
            return resp.body;
          });
        } else {
          p = fetch(url, { headers: headers }).then(function (resp) {
            if (!resp.ok) throw new Error("API HTTP " + resp.status);
            return resp.text();
          });
        }
        return p.then(function (body) {
          var txt = String(body || "").trim();

          var j;
          try { j = JSON.parse(txt); } catch (e) { throw new Error("API 非 JSON: " + txt.slice(0, 120)); }

          try {

            // 有时包在 data 里
            if (j && j.data && j.data.results) j = j.data;
            var list = (j && j.results) || (j && j.data) || [];
            if (!Array.isArray(list)) list = [];
            for (var i = 0; i < list.length; i++) {
              var it = list[i] || {};
              var hash = it.infohash || it.infoHash || it.hash || "";
              var size = "";
              if (it.size) {

                if (isFinite(n) && n > 1024 * 1024) size = (n / (1024 * 1024 * 1024)).toFixed(2) + " GiB";
                else size = String(it.size);
              }
              if (it.seeders != null) size = (size ? size + " · " : "") + "S:" + it.seeders;
              pushHash(items, seen, hash, it.title || it.name, size, "solid");
              if (items.length >= 20) break;

          } catch (e) {

          var m;
          while ((m = re.exec(String(html || ""))) !== null) {
            pushHash(items, seen, m[1], number, "", "html");

          { type: "rss", url: "https://sukebei.nyaa.si/?page=rss&c=0_0&f=0&q=" + q },

        ];

        function tryAt(i) {
          if (i >= urls.length) return Promise.resolve([]);
          var src = urls[i];
          return Promise.race([
            doReq(src.url),
            new Promise(function (resolve) { setTimeout(function () { resolve(""); }, 10000); })

            if (items.length) return items;
            return tryAt(i + 1);

        if (!isFinite(n) || n <= 0) return String(v);
        // API 常见返回 MB 数值；过大则按字节处理
        if (n < 1024 * 1024) {

          return n + " MB";
        }
        var u = ["B", "KB", "MB", "GB", "TB"];

      function fetchWithCache(url, options) {
        var reqOpts = options || {};

        // 补全常见浏览器请求头，降低被 Cloudflare 拦截概率
        if (!reqOpts.headers["Accept"]) {
          reqOpts.headers["Accept"] = "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8";
        }
        if (!reqOpts.headers["Accept-Language"]) {
          reqOpts.headers["Accept-Language"] = "zh-CN,zh;q=0.9,en;q=0.8";
        }
        if (!reqOpts.headers["User-Agent"]) {
          reqOpts.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36";
        }
        if (!reqOpts.headers["Referer"]) {
          reqOpts.headers["Referer"] = SITE_BASE + "/";
        }

        if (manualCookie) {
          reqOpts.headers["Cookie"] = manualCookie;
        }

        function handleHtml(html) {
          if (isCloudflareChallenge(html)) {
            throw new Error("CLOUDFLARE_CHALLENGE");
          }
          return html;
        }

        if (fm && fm.req) {
          reqOpts.credentials = "include";
          return fm.req(url, reqOpts).then(function (resp) {
            if (resp && resp.ok) {
              return handleHtml(resp.body);
            }
            throw new Error("fm.req failed: " + (resp ? resp.status : "no response"));
          });
        }
        return fetch(url, reqOpts).then(function (resp) {
          if (!resp.ok) throw new Error("fetch failed: " + resp.status);
          return resp.text().then(handleHtml);
        });
      }

          var list = sortMagnets((magData && magData.magnets) || []);
          var out = [];
          for (var i = 0; i < list.length; i++) {
            var m = list[i] || {};
            var hash = String(m.hash || "").trim().replace(/^magnet:\?xt=urn:btih:/i, "");
            var url = hash ? magnetUrl(hash, m.name || m.title || "") : (m.magnet_url || m.url || m.pikpak_url || "");
            if (!url) continue;
            var name = cleanText(m.name || m.title || hash || "magnet");
            var tags = [];
            var fc = Number(m.files_count || 0);
            if (fc === 1) tags.push("单文件");
            else if (fc > 1) tags.push(fc + "文件");
            if (m.cnsub || m.has_cnsub || m.is_subtitle) tags.push("中字");
            if (m.hd) tags.push("HD");
            var size = formatSize(m.size);
            if (size) tags.push(size);
            if (tags.length) name = name + " [" + tags.join("/") + "]";
            if (fc === 1 || /\.mp4|\.mkv/i.test(name)) name = "★ " + name;
            out.push({ name: name, url: url, size: size, date: cleanText(m.created_at || m.date || ""), source: "jdb" });
          }
          return out;
        }).catch(function (err) {
          log("official magnets error", err && err.message || err);
          return [];
        });
        return official.then(function (mags) {
          if (mags && mags.length) {
            result.magnets = mags;
            return result;
          }
          var num = result.number || extractNumber(result.title) || "";
          result.number = num;
          if (!num) return result;
          return Promise.race([
            fetchMagnetsByNumber(num),
            new Promise(function (resolve) { setTimeout(function () { resolve([]); }, 35000); })
          ]).then(function (alt) {
            result.magnets = alt || [];
            return result;
          }).catch(function () { return result; });
        }).catch(function () { return result; });
      }

      function renderFilterChips() {
        var container = document.getElementById("filterChips");
        container.replaceChildren();
        if (state.viewMode === "actors") {
          for (var i = 0; i < ACTOR_SUB_LABELS.length; i++) {
            var sub = ACTOR_SUB_LABELS[i];
            var chip = document.createElement("button");
            chip.className = "chip" + (sub.id === state.currentActorSub ? " active" : "");
            chip.textContent = sub.label;
            chip.tabIndex = 0;
            chip.setAttribute("data-actor-sub", sub.id);
            (function (subId) {
              chip.addEventListener("click", function () {
                state.currentActorSub = subId;
                state.currentPage = 1;
                state.currentQuery = "";
                document.getElementById("searchInput").value = "";
                document.getElementById("actorSearchInput").value = "";
                renderFilterChips();
                loadActorsListData();
              });
            })(sub.id);
            container.appendChild(chip);
          }
          return;
        }
        if (state.viewMode === "actorVideos") {
          return;
        }
        for (var i = 0; i < FILTERS.length; i++) {
          var f = FILTERS[i];
          var chip = document.createElement("button");
          chip.className = "chip" + (f.id === state.currentFilter ? " active" : "");
          chip.textContent = f.label;
          chip.tabIndex = 0;
          chip.setAttribute("data-filter", f.id);
          chip.setAttribute("data-fm-key", "filter-" + f.id);
          (function (filterId) {
            chip.addEventListener("click", function () {
              state.currentFilter = filterId;
              state.currentPage = 1;
              renderFilterChips();
              loadVideoList();
            });
          })(f.id);
          container.appendChild(chip);
        }
      }

      function performSearch() {
        var input = document.getElementById("searchInput");
        var query = cleanText(input.value);
        if (!query) {
          state.currentQuery = "";
          state.currentPage = 1;
          if (state.viewMode === "actors") {
            document.getElementById("sectionTitle").textContent = "🎬 女优";
            loadActorsListData();
          } else {
            state.viewMode = "normal";
            document.getElementById("sectionTitle").textContent = "热播";
            loadVideoList();
          }
          return;
        }
        if (state.viewMode === "actors" || state.currentCategory === "actors") {
          state.viewMode = "actors";
          state.currentCategory = "actors";
          state.currentQuery = query;
          state.currentPage = 1;
          state.currentActorSub = "recommend";
          document.getElementById("sectionTitle").textContent = "女优搜索: " + query;
          renderCategoryChips();
          renderFilterChips();
          loadActorsListData();
          return;
        }
        state.currentQuery = query;
        state.currentPage = 1;
        state.currentCategory = "";
        state.currentFilter = "";
        state.viewMode = "normal";
        document.getElementById("sectionTitle").textContent = "搜索: " + query;
        renderCategoryChips();
        renderFilterChips();
        loadVideoList();
      }

      function setupUI() {
        renderCategoryChips();
        renderFilterChips();

        var searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            searchInput.blur();
            performSearch();
          }
        });
        var searchBtn = document.getElementById("searchBtn");
        searchBtn.addEventListener("click", function () {
          performSearch();
        });

        var actorSearchInput = document.getElementById("actorSearchInput");
        actorSearchInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            actorSearchInput.blur();
            performActorSearch();
          }
        });
        var actorSearchBtn = document.getElementById("actorSearchBtn");
        actorSearchBtn.addEventListener("click", function () {
          performActorSearch();
        });

        if (state.isTV) {
          searchInput.setAttribute("readonly", "true");
          searchInput.addEventListener("focus", function () {
            searchInput.removeAttribute("readonly");
          });
          searchInput.addEventListener("blur", function () {
            searchInput.setAttribute("readonly", "true");
          });
        }

        var detailBack = document.getElementById("detailBack");
        detailBack.addEventListener("click", function () {
          closeDetail();
        });

        window.addEventListener("popstate", function (e) {
          if (e.state && e.state.type === "detail") {
            if (!state.detailVid) return;
          } else {
            if (document.body.classList.contains("detail-active")) {
              closeDetail();
            }
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" || e.key === "Backspace") {
            if (document.body.classList.contains("detail-active")) {
              e.preventDefault();
              closeDetail();
            }
          }
        });

        overlay = document.getElementById('cookieOverlay');
        input = document.getElementById('cookieInput');
        saveBtn = document.getElementById('cookieSave');
        clearBtn = document.getElementById('cookieClear');
        closeBtn = document.getElementById('cookieClose');
        triggerBtn = document.getElementById('cookieTrigger');

        if (triggerBtn) {
          triggerBtn.addEventListener('click', openCookieModal);
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', closeCookieModal);
        }
        if (overlay) {
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeCookieModal();
          });
        }
        if (saveBtn) {
          saveBtn.addEventListener('click', function() {
            var val = input.value.trim();
            setManualCookie(val);
            closeCookieModal();
            toast('Cookie 已保存');
            loadVideoList();
          });
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', function() {
            setManualCookie('');
            input.value = '';
            closeCookieModal();
            toast('Cookie 已清除');
            loadVideoList();
          });
        }

        document.getElementById("sectionTitle").textContent = state.currentQuery ? "搜索: " + state.currentQuery : "热播";
        loadVideoList();
      }

      function detectTV() {
        if (window.fongmiClient && window.fongmiClient.isLeanback) {
          state.isTV = true;
          document.documentElement.classList.add("tv-mode");
        }
        if (window.innerWidth > 960 && window.innerWidth / window.innerHeight > 1.3) {
          state.isTV = true;
          document.documentElement.classList.add("tv-mode");
        }
      }

      function init() {
        detectTV();
        if (window.fongmiBridge) {
          state.isApp = true;
          document.documentElement.classList.add("fm-native");
          document.documentElement.classList.add("native-phone-app");
        }
        waitForSdk(2000).then(function (ready) {
          state.sdkReady = ready;
          log("SDK ready:", ready);
          if (ready && sdk() && sdk().ui && sdk().ui.setChrome) {
            try {
              sdk().ui.setChrome({
                mode: "edge",
                statusBarStyle: "light",
                navigationBarStyle: "light",
                startup: true
              });
            } catch (e) {
              log("setChrome error:", e);
            }
          }
          if (location.hash && location.hash.indexOf("detail=") === 1) {
            var vidFromHash = location.hash.split("detail=")[1].split("&")[0];
            if (vidFromHash) {
              openDetail(decodeURIComponent(vidFromHash), "");
              return;
            }
          }
          setupUI();
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
