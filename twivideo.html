<!doctype html>

<html lang="zh-CN">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TWIVIDEO</title>

  <style>

    body{margin:0;background:#303840;color:#f4f7fb;font-family:sans-serif;padding:12px}

    .search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}

    .field,.btn{min-height:42px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(34,43,51,.42);color:#f4f7fb;padding:0 12px;font-size:14px}

    .chips{display:flex;gap:8px;overflow-x:auto;padding:5px 0}

    .chip{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(34,43,51,.42);color:rgba(226,234,242,.72);font-size:13px}

    .chip.active{background:rgba(48,61,70,.58);color:#f4f7fb}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

    .card{border-radius:8px;overflow:hidden;background:rgba(76,88,98,.58);border:1px solid rgba(255,255,255,.2);text-align:left;padding:0;cursor:pointer}

    .thumb{aspect-ratio:2/3;background:rgba(20,24,28,.5);display:grid;place-items:center;color:rgba(255,255,255,.3);font-size:20px;font-weight:900}

    .thumb img{width:100%;height:100%;object-fit:cover}

    .card-body{padding:7px;font-size:12px;font-weight:760;line-height:1.25}

    .empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:rgba(226,234,242,.72);border:1px dashed rgba(255,255,255,.22);border-radius:8px}

    .sheet{position:fixed;inset:0;z-index:40;display:none;background:#303840;padding:12px;overflow:auto}

    .sheet.active{display:block}

    .detail-card{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:12px;background:rgba(76,88,98,.58);border-radius:8px;border:1px solid rgba(255,255,255,.2)}

    .poster{width:112px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.2)}

    .poster img{width:100%;height:100%;object-fit:cover}

    .detail-title{margin:0 0 10px;font-size:18px;font-weight:880}

    .toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:80;display:none;padding:10px 12px;background:rgba(76,88,98,.82);border-radius:8px;border:1px solid rgba(255,255,255,.2);font-size:13px}

    .toast.show{display:block}

  </style>

</head>

<body>

  <main>

    <form class="search" id="searchForm" autocomplete="off">

      <input class="field" id="searchInput" type="search" placeholder="検索キーワード">

      <button class="btn" type="submit">搜索</button>

    </form>

    <nav class="chips" id="chips"></nav>

    <section class="grid" id="grid"></section>

    <button class="btn" id="moreBtn" style="display:none;width:100%;margin-top:12px">加载更多</button>

  </main>

  <section class="sheet" id="detailSheet">

    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">

      <button class="btn" id="closeDetailBtn">← 返回</button>

      <strong>详情</strong>

    </div>

    <div id="detailBody"></div>

  </section>

  <div class="toast" id="toast"></div>

  <script>

    (function() {

      "use strict";

      var HOST = "https://twivideo.net";

      var CATS = [["ranking|24|p6","ランキング(24時間)"],["0|post_date|p4","新着DL"],["ranking|72|p6","ランキング(3日間)"],["ranking|168|p6","ランキング(1週間)"],["trending|r_count|p7","急上昇"],["likeranking|24|p6","高評価"]];

      var state = { cat: CATS[0][0], page: 1, items: [], busy: false, hasMore: false, token: "" };

      function $(id){ return document.getElementById(id); }

      function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

      function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show")},2400); }

      function renderChips(){

        $("chips").innerHTML = CATS.map(function(c){

          return '<button class="chip'+(c[0]===state.cat?" active":"")+'" data-cat="'+c[0]+'">'+c[1]+'</button>';

        }).join("");

      }

      function renderList(){

        if(!state.items.length && !state.busy){ $("grid").innerHTML='<div class="empty">没有找到内容</div>'; return; }

        $("grid").innerHTML = state.items.map(function(item){

          var bg = 'linear-gradient(135deg,hsl('+(String(item.id).length*37%360)+',36%,18%),hsl('+((String(item.id).length*37+58)%360)+',32%,12%))';

          return '<button class="card" data-id="'+escapeHtml(item.id)+'">'+

            '<div class="thumb" style="background:'+bg+'">'+(item.pic?'<img src="'+escapeHtml(item.pic)+'" referrerpolicy="no-referrer" onerror="this.remove()">':'<span>'+escapeHtml(item.title)+'</span>')+'</div>'+

            '<div class="card-body">'+escapeHtml(item.title)+'</div></button>';

        }).join("");

        $("moreBtn").style.display = state.hasMore && !state.busy ? "block" : "none";

      }

      function getToken(){

        if(state.token) return Promise.resolve(state.token);

        return fetch(HOST+"/templates/ajax_view_token.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","X-Requested-With":"XMLHttpRequest","Referer":HOST+"/?ranking"},body:""}).then(function(r){return r.text()}).then(function(t){

          var m=t.match(/"token"\s*:\s*"([^"]+)"/); if(m){state.token=m[1]; return state.token;} return "";

        }).catch(function(){return ""});

      }

      function loadList(reset){

        if(state.busy) return;

        if(reset){state.page=1;state.items=[];state.hasMore=false;window.scrollTo(0,0);}

        state.busy=true;

        var parts=state.cat.split("|");

        var offset=(state.page-1)*50;

        getToken().then(function(){

          var params="offset="+offset+"&limit=50&tag=null&type="+encodeURIComponent(parts[0])+"&order="+encodeURIComponent(parts[1])+"&le=1000&ty="+encodeURIComponent(parts[2])+"&myarray=[]&offset_int="+offset+"&view_token="+encodeURIComponent(state.token||"");

          return fetch(HOST+"/templates/view_lists.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","X-Requested-With":"XMLHttpRequest","Referer":HOST+"/?ranking"},body:params});

        }).then(function(r){return r.text()}).then(function(html){

          var doc=new DOMParser().parseFromString(html,"text/html");

          var nodes=doc.querySelectorAll("li.art_li,div.art_li");

          var seen={};

          state.items.forEach(function(i){seen[i.id]=true});

          var count=0;

          nodes.forEach(function(n){

            var a=n.querySelector("a"); if(!a) return;

            var href=a.getAttribute("href"); if(!href||seen[href]) return;

            seen[href]=true;

            var img=n.querySelector("img");

            var pic=img?(img.getAttribute("data-src")||img.getAttribute("src")):"";

            if(pic && pic.startsWith("/")) pic=HOST+pic;

            var name=a.getAttribute("data-id")||(img&&img.getAttribute("alt"))||href.split("/").pop();

            state.items.push({id:href,title:name,pic:pic});

            count++;

          });

          state.hasMore=count>=12;

          state.busy=false;

          renderList();

        }).catch(function(e){

          state.busy=false;

          toast("加载失败:"+e.message);

          renderList();

        });

      }

      function openDetail(id){

        var item=state.items.find(function(i){return i.id===id})||{id:id,title:id,pic:""};

        $("detailBody").innerHTML='<div class="empty">加载详情...</div>';

        $("detailSheet").classList.add("active");

        document.body.style.overflow="hidden";

        fetch(HOST+id,{headers:{"Referer":HOST+"/"}}).then(function(r){return r.text()}).then(function(html){

          var m=html.match(/(https?:\/\/[^"'\s<>]+?\.m3u8[^"'\s<>]*)/i)||html.match(/(https?:\/\/[^"'\s<>]+?\.mp4[^"'\s<>]*)/i)||html.match(/source\s+src=["']([^"']+)["']/i);

          var url=m?m[1]:"";

          if(url.startsWith("//")) url="https:"+url;

          $("detailBody").innerHTML='<div class="detail-card">'+

            '<div class="poster">'+(item.pic?'<img src="'+escapeHtml(item.pic)+'" referrerpolicy="no-referrer">':'')+'</div>'+

            '<div><h2 class="detail-title">'+escapeHtml(item.title)+'</h2>'+

            (url?'<div style="margin-top:12px"><button class="btn" onclick="window.open(\''+url+'\',\'_blank\')">▶ 播放</button></div>':'<div style="color:rgba(226,234,242,.72)">未找到播放地址</div>')+

            '</div></div>';

        }).catch(function(e){

          $("detailBody").innerHTML='<div class="empty">加载失败:'+e.message+'</div>';

        });

      }

      function closeDetail(){

        $("detailSheet").classList.remove("active");

        document.body.style.overflow="";

      }
            $("chips").addEventListener("click",function(e){
        var btn=e.target.closest("[data-cat]");
        if(btn){ state.cat=btn.getAttribute("data-cat"); renderChips(); loadList(true); }
      });
      $("grid").addEventListener("click",function(e){
        var card=e.target.closest(".card");
        if(card) openDetail(card.getAttribute("data-id"));
      });
      $("moreBtn").addEventListener("click",function(){ state.page++; loadList(false); });
      $("closeDetailBtn").addEventListener("click",closeDetail);
      $("searchForm").addEventListener("submit",function(e){ e.preventDefault(); toast("搜索功能需TVBox原生支持"); });
      renderChips();
      loadList(true);
    })();
  </script>
</body>
</html>
