  <style>
    :root {

      --panel-rgb: 26, 26, 46;

      --muted: rgba(210, 210, 230, .72);
      --line: rgba(255, 255, 255, .15);
      --line-strong: rgba(255, 255, 255, .28);
      --control: rgba(40, 40, 65, .55);
      --control-active: rgba(60, 60, 95, .65);
      --accent: #e85d75;
      --accent-2: #ff6b6b;
      --focus-line: rgba(232, 93, 117, .8);
      --focus-glow: rgba(232, 93, 117, .25);

      --radius: 8px;
      --fm-web-height: 100vh;
      --fm-safe-top: 0px;
      --fm-safe-right: 0px;
      --fm-safe-bottom: 20px;
      --fm-safe-left: 0px;
      --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
      --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
      --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
      --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));

    .search-bar {

      width: 44px;
      height: 44px;
    }
    .field {

      min-height: 44px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--control);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      backdrop-filter: blur(10px) saturate(1.05);
    }

      height: 42px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);

      border: 1px solid var(--line);
      color: var(--text);

      height: 19px;

      padding: 0 12px;

      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      backdrop-filter: blur(10px) saturate(1.05);

      border-color: var(--accent-2);

    }

    }

      max-width: 100%;

      overflow: hidden;

      gap: 8px;

    .card {

      background: var(--panel-soft);
      border: 1px solid var(--line);

      border: 1px solid rgba(255,255,255,.18);

      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(6px);

      top: 6px;
      min-height: 20px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(93,173,226,.35);
      border: 1px solid rgba(93,173,226,.5);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(6px);
    }
    .empty {

      justify-content: center;
      align-items: center;

      border-radius: var(--radius);

      color: var(--muted);

    .btn {

      align-items: center;
      justify-content: center;

    }

    }

      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      margin-bottom: 12px;

    }

      function parseVideoCards(doc) {
        if (!doc) return [];
        var items = [];

        if (gridItems.length === 0) {
          gridItems = doc.querySelectorAll("a[href*='/v/']");
        }
        var seen = {};
        for (var i = 0; i < gridItems.length; i++) {
          var el = gridItems[i];
          var linkEl = el.tagName === "A" ? el : el.querySelector("a[href*='/v/']");
          if (!linkEl) continue;
          var href = linkEl.getAttribute("href");
          var vid = extractVidFromUrl(href);
          if (!vid) continue;
          if (seen[vid]) continue;
          seen[vid] = true;
          var imgEl = el.querySelector("img");
          var coverUrl = imgEl ? absoluteUrl(imgEl.getAttribute("src") || imgEl.getAttribute("data-src") || "") : "";
          var titleEl = el.querySelector(".video-title, .uid, .item-title, strong");
          var title = cleanText(titleEl ? titleEl.textContent : vid);
          var scoreEl = el.querySelector(".score, .meta .score, .value");
          var score = "";
          if (scoreEl) {
            score = cleanText(scoreEl.textContent).replace(/分.*$/, "");
          }
          var dateEl = el.querySelector(".meta, .date, time");
          var date = dateEl ? cleanText(dateEl.textContent) : "";
          var hasMagnet = false;
          var hasSubtitle = false;
          var tags = el.querySelectorAll(".tag, .label");
          for (var t = 0; t < tags.length; t++) {
            var tagText = cleanText(tags[t].textContent);
            if (tagText.indexOf("磁") !== -1) hasMagnet = true;
            if (tagText.indexOf("字") !== -1) hasSubtitle = true;
          }
          var textAll = el.textContent || "";
          if (textAll.indexOf("含磁") !== -1 || textAll.indexOf("磁鏈") !== -1) hasMagnet = true;
          if (textAll.indexOf("字幕") !== -1 || textAll.indexOf("中字") !== -1) hasSubtitle = true;
          items.push({
            vid: vid,
            title: title,
            cover: coverUrl,
            score: score,
            date: date,
            hasMagnet: hasMagnet,
            hasSubtitle: hasSubtitle
          });
          if (items.length >= CONFIG.pageSize) break;

      function parseDetailPage(doc, html) {
        if (!doc) return null;
        var result = {
          vid: "", title: "", cover: "", score: "", date: "", magnets: []
        };
        var titleEl = doc.querySelector("h2.title, .video-title, h1, .title");
        if (titleEl) result.title = cleanText(titleEl.textContent);
        var imgEl = doc.querySelector(
          ".video-cover img, .column-video-cover img, .movie-cover img, " +
          ".img-thumbnail, img[src*='/covers/'], img[src*='/thumbs/']"
        );
        if (imgEl) result.cover = absoluteUrl(imgEl.getAttribute("src") || imgEl.getAttribute("data-src") || "");
        var scoreEl = doc.querySelector(".score, .star-num, .panel-block .value");
        if (scoreEl) result.score = cleanText(scoreEl.textContent).replace(/[^\d.]/g, "");
        var dateEl = doc.querySelector(".date, .panel-block.first-block time, .meta time");
        if (dateEl) result.date = cleanText(dateEl.textContent);

        // 按 JavDB 磁链表结构解析（名称/大小/日期）
        var seen = {};
        var itemRe = /<div class="item[^"]*"[^>]*>([\s\S]*?)<div class="buttons">/gi;
        var itemMatch;
        var count = 0;
        while ((itemMatch = itemRe.exec(html)) !== null) {
          var block = itemMatch[1];
          var magMatch = block.match(/href="(magnet:\?xt=urn:btih:[^"]+)"/i);
          if (!magMatch) continue;
          var url = magMatch[1].replace(/&amp;/g, "&").trim();
          if (!url || seen[url]) continue;
          seen[url] = true;

          var name = "";
          var nameMatch = block.match(/<span[^>]*class="[^"]*\bname\b[^"]*"[^>]*>([\s\S]*?)<\/span>/i);
          if (nameMatch) name = cleanText(nameMatch[1].replace(/<[^>]+>/g, " "));
          if (!name) {
            var titleMatch = block.match(/[?&]dn=([^&"']+)/i);
            if (titleMatch) {
              try { name = cleanText(decodeURIComponent(titleMatch[1].replace(/\+/g, " "))); } catch (e) { name = cleanText(titleMatch[1]); }
              name = name.replace(/^\[javdb\.com\]/i, "").trim();
            }
          }
          if (!name) name = "磁力链接 " + (++count);

          var size = "";
          var metaMatch = block.match(/<span[^>]*class="[^"]*\bmeta\b[^"]*"[^>]*>([\s\S]*?)<\/span>/i);
          if (metaMatch) size = cleanText(metaMatch[1].replace(/<[^>]+>/g, " "));
          if (!size) {
            var ds = block.match(/data-size="(\d+)"/i);
            if (ds) {
              var mb = Number(ds[1]);
              size = mb >= 1024 ? ((mb / 1024).toFixed(2).replace(/\.00$/, "") + "GB") : (mb + "MB");
            }
          }

          var date = "";
          var timeMatch = block.match(/<span[^>]*class="[^"]*\btime\b[^"]*"[^>]*>([^<]+)<\/span>/i);
          if (timeMatch) date = cleanText(timeMatch[1]);
          if (!date) {
            var dd = block.match(/data-date="(\d{8})"/i);
            if (dd) {
              var d = dd[1];
              date = d.slice(0, 4) + "-" + d.slice(4, 6) + "-" + d.slice(6, 8);
            }
          }
          result.magnets.push({ name: name, url: url, size: size, date: date });
        }

        // 兜底：整页扫 magnet，名称尽量用 dn=
        if (result.magnets.length === 0) {
          var magnetMatches = html.match(/magnet:\?xt=urn:btih:[^\"'\s<>]+/g) || [];
          for (var i = 0; i < magnetMatches.length; i++) {
            var u2 = magnetMatches[i].replace(/&amp;/g, "&").replace(/[\"'<>].*$/, "").trim();
            if (seen[u2]) continue;
            seen[u2] = true;
            var nm = "磁力链接 " + (i + 1);
            var dn = u2.match(/[?&]dn=([^&]+)/i);
            if (dn) {
              try { nm = cleanText(decodeURIComponent(dn[1].replace(/\+/g, " "))); } catch (e) { nm = cleanText(dn[1]); }
              nm = nm.replace(/^\[javdb\.com\]/i, "").trim() || nm;
            }
            result.magnets.push({ name: nm, url: u2, size: "", date: "" });
          }
        }
        return result;
      }

      function extractCodeFromTitle(title) {
        var t = cleanText(title || "");
        if (!t) return "";
        var m = t.match(/\b(FC2[-_\s]?PPV[-_\s]?\d{6,8}|FC2[-_\s]?\d{6,8})\b/i);
        if (m) {
          var raw = m[1].replace(/[\s_]+/g, "-").toUpperCase();
          raw = raw.replace(/FC2-?PPV-?/i, "FC2-PPV-").replace(/FC2(?!-)/i, "FC2-");
          return raw.replace(/--+/g, "-");
        }
        m = t.match(/\b([A-Z]{2,12}-\d{2,5}[A-Z]?)\b/i);
        if (m) return m[1].toUpperCase();
        // 无码常见 数字-数字
        m = t.match(/\b(\d{6}[-_]\d{2,4})\b/);
        if (m) return m[1];
        m = t.match(/\b(\d{6}-\d{3})\b/);
        if (m) return m[1];
        var first = t.split(/\s+/)[0];
        if (first && first.length >= 4 && first.length <= 28) return first;
        return "";
      }

      function extractTitleKeywords(title) {
        var t = cleanText(title || "");
        if (!t) return [];
        t = t.replace(/\b(FC2[-_\s]?PPV[-_\s]?\d{6,8}|FC2[-_\s]?\d{6,8}|[A-Z]{2,12}-\d{2,5}[A-Z]?|\d{6}[-_]\d{2,4})\b/gi, " ");
        t = t.replace(/\b(The\s+Motion\s+Anime|Movie\s+Edition|Motion\s+Anime|HD|FHD|1080p|720p|中文字幕|無碼|有碼|BEST)\b/gi, " ");
        t = t.replace(/[\u3000\[\]【】（）()「」『』<>《》~～・·|｜\/\\]+/g, " ");
        t = t.replace(/\s+/g, " ").trim();
        var keys = [];
        if (t.length >= 2) keys.push(t);
        if (t.length > 12) {
          var short = t.slice(0, 16).replace(/\s+\S*$/, "").trim();
          if (short.length >= 4) keys.push(short);
        }
        var parts = t.split(/\s+/).filter(function (p) { return p.length >= 3; });
        parts.sort(function (a, b) { return b.length - a.length; });
        if (parts[0]) keys.push(parts[0]);
        if (parts[1]) keys.push(parts[1]);
        return keys;
      }

      function buildSearchQueries(code, title) {
        var qs = [];
        var seen = {};
        function add(q) {
          q = cleanText(q || "");
          if (!q || q.length < 2 || seen[q]) return;
          seen[q] = true;
          qs.push(q);
        }
        code = cleanText(code || "");
        title = cleanText(title || "");
        var titleKeys = extractTitleKeywords(title);
        for (var i = 0; i < titleKeys.length; i++) add(titleKeys[i]);
        add(code);
        if (code) {
          var up = code.toUpperCase();
          var fc2 = up.match(/FC2(?:-?PPV)?-?(\d{6,8})/i);
          if (fc2) {
            var num = fc2[1];
            add("FC2 " + num);
            add("FC2-" + num);
            add("FC2-PPV-" + num);
            add("FC2PPV " + num);
            add(num);
          }
          var m = up.match(/^([A-Z]{2,12})-(\d{2,5}[A-Z]?)$/);
          if (m) {
            add(m[1] + " " + m[2]);
            add(m[1] + m[2]);
          }
          // 无码 060125-001 -> 也试空格
          var u = code.match(/^(\d{6})[-_](\d{2,4})$/);
          if (u) add(u[1] + " " + u[2]);
        }
        if (title) add(extractCodeFromTitle(title));
        return qs;
      }

      function copyText(text) {

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { toast("已复制: " + text); }).catch(function () { fallbackCopy(text); });
        } else {
          fallbackCopy(text);

      }

      function fallbackCopy(text) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          toast("已复制: " + text);
        } catch (e) {
          toast("复制失败");
        }
      }

      function fetchExternalHtml(url) {
        var headers = {
          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",

        };
        var fm = sdk();
        if (fm && fm.req) {

            if (!resp || !resp.ok) throw new Error("HTTP " + (resp ? resp.status : "fail"));

          return resp.text();
        });

      function parseSukebeiHtml(html) {
        var results = [];
        var seen = {};
        if (!html) return results;
        var rowRe = /<tr[^>]*class="[^"]*"[^>]*>([\s\S]*?)<\/tr>/gi;
        var row;
        while ((row = rowRe.exec(html)) !== null) {
          var block = row[1];
          var magMatch = block.match(/href="(magnet:\?xt=urn:btih:[^"]+)"/i);
          if (!magMatch) continue;
          var magUrl = magMatch[1].replace(/&amp;/g, "&");
          if (seen[magUrl]) continue;
          seen[magUrl] = true;
          var nameMatch = block.match(/<a[^>]*href="\/view\/\d+"[^>]*(?:title="([^"]*)")?[^>]*>([^<]*)<\/a>/i);
          var name = cleanText((nameMatch && (nameMatch[1] || nameMatch[2])) || "") || "Sukebei 磁链";
          var sizeMatch = block.match(/<td[^>]*class="[^"]*text-center[^"]*"[^>]*>(\d+(?:\.\d+)?\s*[KMGT]iB)<\/td>/i);
          var size = sizeMatch ? cleanText(sizeMatch[1]) : "";
          var dateMatch = block.match(/data-timestamp="(\d+)"[^>]*>([^<]+)</i);
          var date = dateMatch ? cleanText(dateMatch[2]) : "";
          results.push({ name: name, url: magUrl, size: size, date: date, source: "sukebei" });
          if (results.length >= 40) break;
        }
        if (results.length === 0) {
          var all = html.match(/magnet:\?xt=urn:btih:[^\"'\s<>]+/gi) || [];
          for (var i = 0; i < all.length; i++) {
            var u = all[i].replace(/&amp;/g, "&");
            if (seen[u]) continue;
            seen[u] = true;
            results.push({ name: "Sukebei 磁链 " + (i + 1), url: u, size: "", date: "", source: "sukebei" });
            if (results.length >= 20) break;
          }
        }
        return results;
      }

      function fetchMagnetsFromSukebei(code, title) {
        var queries = buildSearchQueries(code, title);
        if (!queries.length) return Promise.resolve([]);
        log("[sukebei] queries", queries.join(" | "));
        function tryOne(index, acc) {
          if (index >= queries.length) return Promise.resolve(acc);
          if (acc.length >= 10) return Promise.resolve(acc);
          var q = queries[index];
          var url = "https://sukebei.nyaa.si/?f=0&c=0_0&q=" + encodeURIComponent(q);
          return fetchExternalHtml(url).then(function (html) {
            var list = parseSukebeiHtml(html);
            log("[sukebei]", q, "->", list.length);
            var seen = {};
            for (var i = 0; i < acc.length; i++) seen[acc[i].url] = true;
            for (var j = 0; j < list.length; j++) {
              if (!seen[list[j].url]) {
                seen[list[j].url] = true;
                acc.push(list[j]);
              }
            }
            return tryOne(index + 1, acc);
          }).catch(function (err) {
            log("[sukebei] fail", q, err && err.message || err);
            return tryOne(index + 1, acc);
          });
        }
        return tryOne(0, []);
      }

      function fetchWithCache(url, options) {
        var reqOpts = options || {};
        if (!reqOpts.headers) reqOpts.headers = {};
        var fm = sdk();

        // ★ FIX: 完全照搬嗅觉浏览器规则的伪装 Header 和 Cookie
        reqOpts.headers["Accept"] = "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        reqOpts.headers["Accept-Language"] = "zh-CN,zh;q=0.9,en;q=0.8";
        reqOpts.headers["User-Agent"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        reqOpts.headers["Referer"] = SITE_BASE + "/";
        
        // 强制注入 over18=1，否则无法查看成人内容
        if (manualCookie) {
          reqOpts.headers["Cookie"] = manualCookie + "; over18=1; locale=zh;";
        } else {
          reqOpts.headers["Cookie"] = "over18=1; locale=zh;";
        }

        function handleHtml(html) {
          if (isCloudflareChallenge(html)) {
            throw new Error("CLOUDFLARE_CHALLENGE");
          }
          return html;
        }

        if (fm && fm.req) {
          reqOpts.credentials = "include";
          reqOpts.timeout = 15000;
          return fm.req(url, reqOpts).then(function (resp) {
            if (resp && resp.ok) {
              return handleHtml(resp.body);
            }
            throw new Error("fm.req failed: " + (resp ? resp.status : "no response"));
          });
        }
        return fetch(url, reqOpts).then(function (resp) {
          if (!resp.ok) throw new Error("fetch failed: " + resp.status);
          return resp.text().then(handleHtml);
        });
      }

      function fetchActorsPage(subCategory, page, query) {
        if (query) {
          return apiRequest("/api/v2/search", {
            q: query,
            page: page || 1,
            type: "actor"
          }).then(function (data) {
            var list = (data && data.actors) || [];
            return list.map(mapApiActor);
          });
        }

        if (!subCategory || subCategory === "recommend") {
          return apiRequest("/api/v1/actors/recommend", {
            page: page || 1
          }).then(function (data) {
            data = data || {};
            var seen = {};
            var out = [];
            var groups = ["recommend_actors", "monthly_actors", "new_actors"];
            for (var g = 0; g < groups.length; g++) {
              var arr = data[groups[g]] || [];
              for (var i = 0; i < arr.length; i++) {
                var a = mapApiActor(arr[i]);
                if (!a.id || seen[a.id]) continue;
                seen[a.id] = true;
                out.push(a);
              }
            }
            return out;
          });
        }

        var typeMap = {
          "censored": "0",
          "uncensored": "1",
          "western": "2"
        };
        var type = typeMap[subCategory] || "0";
        return apiRequest("/api/v1/actors", {
          page: page || 1,
          limit: CONFIG.pageSize,
          type: type
        }).then(function (data) {
          var list = (data && data.actors) || [];
          return list.map(mapApiActor);
        }).catch(function () {
          return apiRequest("/api/v1/rankings/actors", {
            page: page || 1,
            type: type
          }).then(function (data) {
            var list = (data && data.actors) || [];
            return list.map(mapApiActor);
          });
        });
      }

      function fetchDetail(vid, fallbackTitle, fallbackCover) {
        var result = {
          vid: String(vid || ""),
          title: cleanText(fallbackTitle || vid || ""),
          cover: normalizeCover(fallbackCover || "", vid),
          score: "",
          date: "",
          magnets: [],
          code: extractCodeFromTitle(fallbackTitle || "")
        };
        if (!vid) return Promise.resolve(result);
        return fetchDetailFromWeb(vid, result).then(function (r) {
          if (r.magnets && r.magnets.length > 0) return r;
          var code = r.code || extractCodeFromTitle(r.title || fallbackTitle || vid);
          r.code = code;
          return fetchMagnetsFromSukebei(code, r.title || fallbackTitle).then(function (list) {
            if (list && list.length > 0) {
              r.magnets = list;
              r.magnetsSource = "sukebei";
              r.errorMsg = "";
            } else {
              r.errorMsg = r.errorMsg || "NO_MAGNET";
            }
            return r;
          });
        });
      }

      function fetchDetailFromWeb(vid, fallbackResult) {
        var url = buildDetailUrl(vid);
        var reqOpts = { headers: { Referer: SITE_BASE + "/" } };
        return fetchWithCache(url, reqOpts).then(function (html) {
          if (isLoginWall(html)) {
            fallbackResult.errorMsg = "LOGIN_REQUIRED";
            return fallbackResult;
          }
          if (isCloudflareChallenge(html)) {
            fallbackResult.errorMsg = "CLOUDFLARE_CHALLENGE";
            return fallbackResult;
          }
          var doc = parseHtml(html);
          if (!doc) return fallbackResult;
          var parsed = parseDetailPage(doc, html);
          if (!parsed) return fallbackResult;
          if (parsed.title) {
            fallbackResult.title = parsed.title;
            fallbackResult.code = extractCodeFromTitle(parsed.title);
          }
          if (parsed.cover) fallbackResult.cover = parsed.cover;
          if (parsed.score) fallbackResult.score = parsed.score;
          if (parsed.date) fallbackResult.date = parsed.date;
          if (parsed.magnets && parsed.magnets.length > 0) {
            fallbackResult.magnets = parsed.magnets;
            fallbackResult.errorMsg = "";
          } else {
            fallbackResult.errorMsg = fallbackResult.errorMsg || "NO_MAGNET";
          }
          return fallbackResult;
        }).catch(function (err) {
          log("[detail] web error:", err && err.message || err);
          if (!fallbackResult.magnets) fallbackResult.magnets = [];
          fallbackResult.errorMsg = "LOGIN_REQUIRED";
          return fallbackResult;
        });
      }

      function proxyImage(url) {
        if (!url) return "";
        url = normalizeCover(url, "");
        var fm = sdk();
        if (fm && fm.res) {
          try {
            return fm.res(url, { headers: { Referer: "https://javdb.com/" } });
          } catch (e) {
            log("fm.res error", e);
          }
        }
        return url;
      }

        document.body.classList.add("detail-active");

        sheet.classList.add("active");

            title: title || vid,
            cover: fallbackCover || "",
            score: "",
            date: "",
            magnets: null
        };
        renderDetail(initialData, vid, fallbackCover);
        
        fetchDetail(vid, title, fallbackCover).then(function (data) {
          if (token !== state.routeToken) return;
          renderDetail(data, vid, fallbackCover);

          if (token !== state.routeToken) return;
          log("fetchDetail error", err);
          initialData.magnets = [];
          initialData.errorMsg = "抓取失败: " + (err.message || "网络异常");
          renderDetail(initialData, vid, fallbackCover);
        });

            statusBar.textContent = "需要 Cookie（Cloudflare 拦截）";
          } else {
            statusBar.textContent = "加载失败，请重试";
          }
          var grid = document.getElementById("videoGrid");
          grid.replaceChildren();
          var errEl = document.createElement("div");
          errEl.className = "empty";
          errEl.textContent = msg;
          errEl.style.gridColumn = "1 / -1";
          grid.appendChild(errEl);
        });
      }

      function renderCategoryChips() {
        var container = document.getElementById("categoryChips");
        container.replaceChildren();
        for (var i = 0; i < CATEGORIES.length; i++) {
          var cat = CATEGORIES[i];
          var chip = document.createElement("button");
          chip.className = "chip" + (cat.id === state.currentCategory ? " active" : "");
          chip.textContent = cat.label;
          chip.tabIndex = 0;
          chip.setAttribute("data-cat", cat.id);
          chip.setAttribute("data-fm-key", "cat-" + cat.id);
          (function (catId) {
            chip.addEventListener("click", function () {
              state.currentCategory = catId;
              state.currentPage = 1;
              state.currentQuery = "";
              state.currentFilter = "";
              state.currentActor = null;
              state.actorPage = 1;
              document.getElementById("searchInput").value = "";
              history.replaceState({ type: "home" }, "", "#");
              if (catId === "actors") {
                state.viewMode = "actors";
                state.currentActorSub = "recommend";
                document.getElementById("actorSearchWrap").classList.add("active");
                var gsb2 = document.querySelector(".search-bar");
                if (gsb2) gsb2.style.display = "none";
                loadActorsListData();
              } else {
                state.viewMode = "normal";
                document.getElementById("actorSearchWrap").classList.remove("active");
                var gsb3 = document.querySelector(".search-bar");
                if (gsb3) gsb3.style.display = "";
                loadVideoList();
              }
              renderCategoryChips();
              renderFilterChips();
            });
          })(cat.id);
          container.appendChild(chip);
        }
      }

      function renderFilterChips() {
        var container = document.getElementById("filterChips");
        container.replaceChildren();
        if (state.viewMode === "actors") {
          for (var i = 0; i < ACTOR_SUB_LABELS.length; i++) {
            var sub = ACTOR_SUB_LABELS[i];
            var chip = document.createElement("button");
            chip.className = "chip" + (sub.id === state.currentActorSub ? " active" : "");
            chip.textContent = sub.label;
            chip.tabIndex = 0;
            chip.setAttribute("data-actor-sub", sub.id);
            (function (subId) {
              chip.addEventListener("click", function () {
                state.currentActorSub = subId;
                state.currentPage = 1;
                state.currentQuery = "";
                document.getElementById("searchInput").value = "";
                document.getElementById("actorSearchInput").value = "";
                renderFilterChips();
                loadActorsListData();
              });
            })(sub.id);
            container.appendChild(chip);
          }
          return;
        }
        if (state.viewMode === "actorVideos") {
          return;
        }
        for (var i = 0; i < FILTERS.length; i++) {
          var f = FILTERS[i];
          var chip = document.createElement("button");
          chip.className = "chip" + (f.id === state.currentFilter ? " active" : "");
          chip.textContent = f.label;
          chip.tabIndex = 0;
          chip.setAttribute("data-filter", f.id);
          chip.setAttribute("data-fm-key", "filter-" + f.id);
          (function (filterId) {
            chip.addEventListener("click", function () {
              state.currentFilter = filterId;
              state.currentPage = 1;
              renderFilterChips();
              loadVideoList();
            });
          })(f.id);
          container.appendChild(chip);
        }
      }

      function performSearch() {
        var input = document.getElementById("searchInput");
        var query = cleanText(input.value);
        if (!query) {
          state.currentQuery = "";
          state.currentPage = 1;
          if (state.viewMode === "actors") {
            document.getElementById("sectionTitle").textContent = "🎬 女优";
            loadActorsListData();
          } else {
            state.viewMode = "normal";
            document.getElementById("sectionTitle").textContent = "热播";
            loadVideoList();
          }
          return;
        }
        if (state.viewMode === "actors" || state.currentCategory === "actors") {
          state.viewMode = "actors";
          state.currentCategory = "actors";
          state.currentQuery = query;
          state.currentPage = 1;
          state.currentActorSub = "recommend";
          document.getElementById("sectionTitle").textContent = "女优搜索: " + query;
          renderCategoryChips();
          renderFilterChips();
          loadActorsListData();
          return;
        }
        state.currentQuery = query;
        state.currentPage = 1;
        state.currentCategory = "";
        state.currentFilter = "";
        state.viewMode = "normal";
        document.getElementById("sectionTitle").textContent = "搜索: " + query;
        renderCategoryChips();
        renderFilterChips();
        loadVideoList();
      }

      function setupUI() {
        renderCategoryChips();
        renderFilterChips();

        var searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            searchInput.blur();
            performSearch();
          }
        });
        var searchBtn = document.getElementById("searchBtn");
        searchBtn.addEventListener("click", function () {
          performSearch();
        });

        var actorSearchInput = document.getElementById("actorSearchInput");
        actorSearchInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            actorSearchInput.blur();
            performActorSearch();
          }
        });
        var actorSearchBtn = document.getElementById("actorSearchBtn");
        actorSearchBtn.addEventListener("click", function () {
          performActorSearch();
        });

        if (state.isTV) {
          searchInput.setAttribute("readonly", "true");
          searchInput.addEventListener("focus", function () {
            searchInput.removeAttribute("readonly");
          });
          searchInput.addEventListener("blur", function () {
            searchInput.setAttribute("readonly", "true");
          });
        }

        var detailBack = document.getElementById("detailBack");
        detailBack.addEventListener("click", function () {
          closeDetail();
        });

        window.addEventListener("popstate", function (e) {
          if (e.state && e.state.type === "detail") {
            if (!state.detailVid) return;
          } else {
            if (document.body.classList.contains("detail-active")) {
              closeDetail();
            }
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" || e.key === "Backspace") {
            if (document.body.classList.contains("detail-active")) {
              e.preventDefault();
              closeDetail();
            }
          }
        });

        overlay = document.getElementById('cookieOverlay');
        input = document.getElementById('cookieInput');
        saveBtn = document.getElementById('cookieSave');
        clearBtn = document.getElementById('cookieClear');
        closeBtn = document.getElementById('cookieClose');
        triggerBtn = document.getElementById('cookieTrigger');

        if (triggerBtn) {
          triggerBtn.addEventListener('click', openCookieModal);
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', closeCookieModal);
        }
        if (overlay) {
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeCookieModal();
          });
        }
        if (saveBtn) {
          saveBtn.addEventListener('click', function() {
            var val = input.value.trim();
            setManualCookie(val);
            closeCookieModal();
            toast('Cookie 已保存');
            loadVideoList();
          });
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', function() {
            setManualCookie('');
            input.value = '';
            closeCookieModal();
            toast('Cookie 已清除');
            loadVideoList();
          });
        }

        document.getElementById("sectionTitle").textContent = state.currentQuery ? "搜索: " + state.currentQuery : "热播";
        loadVideoList();
      }

      function detectTV() {
        if (window.fongmiClient && window.fongmiClient.isLeanback) {
          state.isTV = true;
          document.documentElement.classList.add("tv-mode");
        }
        if (window.innerWidth > 960 && window.innerWidth / window.innerHeight > 1.3) {
          state.isTV = true;
          document.documentElement.classList.add("tv-mode");
        }
      }

      function init() {
        detectTV();
        if (window.fongmiBridge) {
          state.isApp = true;
          document.documentElement.classList.add("fm-native");
          document.documentElement.classList.add("native-phone-app");
        }
        waitForSdk(2000).then(function (ready) {
          state.sdkReady = ready;
          log("SDK ready:", ready);
          if (ready && sdk() && sdk().ui && sdk().ui.setChrome) {
            try {
              sdk().ui.setChrome({
                mode: "edge",
                statusBarStyle: "light",
                navigationBarStyle: "light",
                startup: true
              });
            } catch (e) {
              log("setChrome error:", e);
            }
          }
          if (location.hash && location.hash.indexOf("detail=") === 1) {
            var vidFromHash = location.hash.split("detail=")[1].split("&")[0];
            if (vidFromHash) {
              openDetail(decodeURIComponent(vidFromHash), "");
              return;
            }
          }
          setupUI();
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
