  <style>
    :root {

      --panel-rgb: 26, 26, 46;

      --muted: rgba(210, 210, 230, .72);
      --line: rgba(255, 255, 255, .15);
      --line-strong: rgba(255, 255, 255, .28);
      --control: rgba(40, 40, 65, .55);
      --control-active: rgba(60, 60, 95, .65);
      --accent: #e85d75;
      --accent-2: #ff6b6b;
      --focus-line: rgba(232, 93, 117, .8);
      --focus-glow: rgba(232, 93, 117, .25);

      --radius: 8px;
      --fm-web-height: 100vh;
      --fm-safe-top: 0px;
      --fm-safe-right: 0px;
      --fm-safe-bottom: 20px;
      --fm-safe-left: 0px;
      --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
      --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
      --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
      --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));

    .search-bar {

      width: 44px;
      height: 44px;
    }
    .field {

      min-height: 44px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--control);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      backdrop-filter: blur(10px) saturate(1.05);
    }

      height: 42px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);

      border: 1px solid var(--line);
      color: var(--text);

      height: 19px;

      padding: 0 12px;

      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      backdrop-filter: blur(10px) saturate(1.05);

      border-color: var(--accent-2);

    }

    }

      max-width: 100%;

      overflow: hidden;

      gap: 8px;

    .card {

      background: var(--panel-soft);
      border: 1px solid var(--line);

      border: 1px solid rgba(255,255,255,.18);

      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(6px);

      top: 6px;
      min-height: 20px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(93,173,226,.35);
      border: 1px solid rgba(93,173,226,.5);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(6px);
    }
    .empty {

      justify-content: center;
      align-items: center;

      border-radius: var(--radius);

      color: var(--muted);

    .btn {

      align-items: center;
      justify-content: center;

    }

    }

      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      margin-bottom: 12px;

    }

        if (params) {
          Object.keys(params).forEach(function (k) {
            var v = params[k];
            if (v !== undefined && v !== null && String(v) !== "") {
              qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(String(v)));
            }
          });
        }
        if (qs.length) url += (url.indexOf("?") >= 0 ? "&" : "?") + qs.join("&");
        log("apiRequest", url);

        var fm = sdk();

        if (fm && fm.req) {

            if (!resp || !resp.ok) throw new Error("API HTTP " + (resp ? resp.status : "no response"));

            if (!resp.ok) throw new Error("API HTTP " + resp.status);
            return resp.text();
          });
        }
        return p.then(function (body) {
          var txt = String(body || "").trim();
          if (!txt) throw new Error("API 空响应");
          var j;
          try { j = JSON.parse(txt); } catch (e) { throw new Error("API 非 JSON: " + txt.slice(0, 120)); }
          if (j && j.success === 1) return j.data || {};

        var items = doc.querySelectorAll("#magnets-content .item, .magnet-list .item, .magnet-item");
        if (items.length === 0) {
          items = doc.querySelectorAll(".panel-block"); 
        }
        
        for (var i = 0; i < items.length; i++) {
            var box = items[i];
            var link = box.querySelector("a[href^='magnet:']");
            if (!link) continue;
            var url = link.getAttribute("href").replace(/&amp;/g, '&').trim();
            if (seen[url]) continue;
            seen[url] = true;
            
            var nameEl = box.querySelector(".name, .magnet-name, .item-name");
            var name = nameEl ? cleanText(nameEl.textContent) : "";
            
            var metaEl = box.querySelector(".meta, .magnet-meta, .size");
            var size = metaEl ? cleanText(metaEl.textContent) : "";
            
            var dateEl2 = box.querySelector(".time, .date");
            var date = dateEl2 ? cleanText(dateEl2.textContent) : "";
            
            result.magnets.push({
                name: name || ("磁力链接 " + (result.magnets.length + 1)),
                url: url,
                size: size,
                date: date
            });
        }
        
        // 2. 如果 DOM 没匹配到，退回正则暴力提取
        if (result.magnets.length === 0) {
            var magnetMatches = html.match(/magnet:\?xt=urn:btih:[^\"'\s<>]+/g) || [];
            for (var j = 0; j < magnetMatches.length; j++) {
                var url = magnetMatches[j].replace(/&amp;/g, '&').replace(/[\"'<>].*$/, '').trim();
                if (seen[url]) continue;
                seen[url] = true;
                
                var idx = html.indexOf(url);
                var snippet = html.substring(Math.max(0, idx - 1000), Math.min(html.length, idx + 1000));
                
                var nameMatch = snippet.match(/<div[^>]*class="[^"]*name[^"]*"[^>]*>([\s\S]*?)<\/div>/i) || 
                                snippet.match(/<span[^>]*class="[^"]*name[^"]*"[^>]*>([\s\S]*?)<\/span>/i);
                var name = nameMatch ? cleanText(nameMatch[1].replace(/<[^>]+>/g, '')) : "";
                
                var sizeMatch = snippet.match(/<span[^>]*class="[^"]*meta[^"]*"[^>]*>([\s\S]*?)<\/span>/i) || 
                                snippet.match(/<div[^>]*class="[^"]*meta[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
                var size = sizeMatch ? cleanText(sizeMatch[1].replace(/<[^>]+>/g, '')) : "";

                result.magnets.push({
                    name: name || ("磁力链接 " + (result.magnets.length + 1)),
                    url: url,
                    size: size,
                    date: ""
                });
            }
        }
        
        return result;
      }

      function isCloudflareChallenge(html) {
        if (!html || typeof html !== "string") return false;
        var lower = html.toLowerCase();
        if (lower.indexOf("magnet:") !== -1 || lower.indexOf("video-title") !== -1) return false;
        return lower.indexOf("just a moment") !== -1 ||
               lower.indexOf("cf-browser-verification") !== -1 ||
               lower.indexOf("challenge-platform") !== -1 ||
               lower.indexOf("checking your browser") !== -1 ||
               lower.indexOf("verify you are human") !== -1 ||
               lower.indexOf("cf-challenge") !== -1;
      }

      function fetchWithCache(url, options) {
        var reqOpts = options || {};
        if (!reqOpts.headers) reqOpts.headers = {};
        var fm = sdk();

        reqOpts.headers["Accept"] = "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8";
        reqOpts.headers["Accept-Language"] = "zh-CN,zh;q=0.9,en;q=0.8";
        reqOpts.headers["User-Agent"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        reqOpts.headers["Referer"] = SITE_BASE + "/";
        
        if (manualCookie) {
          reqOpts.headers["Cookie"] = manualCookie + "; over18=1; locale=zh;";
        } else {
          reqOpts.headers["Cookie"] = "over18=1; locale=zh;";
        }

        function handleHtml(html) {
          if (isCloudflareChallenge(html)) {
            throw new Error("CLOUDFLARE_CHALLENGE");
          }
          return html;
        }

        if (fm && fm.req) {
          reqOpts.credentials = "include";
          reqOpts.timeout = 15000;
          return fm.req(url, reqOpts).then(function (resp) {
            if (resp && resp.ok) {
              return handleHtml(resp.body);
            }
            throw new Error("fm.req failed: " + (resp ? resp.status : "no response"));
          });
        }
        return fetch(url, reqOpts).then(function (resp) {
          if (!resp.ok) throw new Error("fetch failed: " + resp.status);
          return resp.text().then(handleHtml);
        });
      }

                if (parsed.date) result.date = parsed.date;

      function supplementWithSobt(result, number, title, vid) {
        var kw = extractKeywordForMagnet(result, number, title, vid);
        if (!kw) {
          result.noMagnet = true;
          return Promise.resolve(result);
        }
        // SOBT → cili.info → cilisousuo.cc
        return searchSobtMagnets(kw).then(function (extra) {
          if (applyExternalMagnets(result, extra, "SOBT")) return result;
          return searchCiliMagnets(kw).then(function (extra2) {
            if (applyExternalMagnets(result, extra2, "CILI")) return result;
            return searchCssMagnets(kw).then(function (extra3) {
              if (applyExternalMagnets(result, extra3, "CSS")) return result;
              if (!result.magnets || !result.magnets.length) result.noMagnet = true;
              return result;
            });
          });
        }).catch(function () {
          return searchCiliMagnets(kw).then(function (extra2) {
            if (applyExternalMagnets(result, extra2, "CILI")) return result;
            return searchCssMagnets(kw).then(function (extra3) {
              if (applyExternalMagnets(result, extra3, "CSS")) return result;
              if (!result.magnets || !result.magnets.length) result.noMagnet = true;
              return result;
            });
          }).catch(function () {
            return searchCssMagnets(kw).then(function (extra3) {
              if (applyExternalMagnets(result, extra3, "CSS")) return result;
              if (!result.magnets || !result.magnets.length) result.noMagnet = true;
              return result;
            }).catch(function () {
              if (!result.magnets || !result.magnets.length) result.noMagnet = true;
              return result;
            });
          });
        });
      }

function proxyImage(url) {
        if (!url) return "";
        url = normalizeCover(url, "");
        var fm = sdk();
        if (fm && fm.res) {
          try {
            return fm.res(url, { headers: { Referer: "https://javdb.com/" } });
          } catch (e) {
            log("fm.res error", e);
          }
        }
        return url;
      }

      function openDetail(vid, number, title, fallbackCover) {
        state.detailVid = vid;
        state.routeToken++;
        var token = state.routeToken;
        history.pushState({ type: "detail", vid: vid }, "", "#detail=" + vid);
        document.body.classList.add("detail-active");
        var sheet = document.getElementById("detailSheet");
        sheet.classList.add("active");
        sheet.scrollTop = 0;
        
        var initialData = {
            vid: vid,
            title: title || vid,
            cover: fallbackCover || "",
            score: "",
            date: "",
            magnets: null
        };
        renderDetail(initialData, vid, fallbackCover);
        
        fetchDetail(vid, number, title, fallbackCover).then(function (data) {
          if (token !== state.routeToken) return;
          renderDetail(data, vid, fallbackCover);
        }).catch(function (err) {
          if (token !== state.routeToken) return;
          log("fetchDetail error", err);
          // 官方失败时仍尝试 SOBT 补充磁链
          var fallback = {
            vid: vid,
            title: title || number || vid,
            cover: fallbackCover || "",
            score: "",
            date: "",
            magnets: []
          };
          supplementWithSobt(fallback, number, title, vid).then(function (data) {
            if (token !== state.routeToken) return;
            if (!data.magnets || !data.magnets.length) {
              data.errorMsg = (err && err.message) ? String(err.message) : "抓取失败";
            }
            renderDetail(data, vid, fallbackCover);
          });
        });
      }

            document.getElementById("sectionTitle").textContent = "热播";
            loadVideoList();
          }
          return;
        }
        if (state.viewMode === "actors" || state.currentCategory === "actors") {
          state.viewMode = "actors";
          state.currentCategory = "actors";
          state.currentQuery = query;
          state.currentPage = 1;
          state.currentActorSub = "recommend";
          document.getElementById("sectionTitle").textContent = "女优搜索: " + query;
          renderCategoryChips();
          renderFilterChips();
          loadActorsListData();
          return;
        }
        state.currentQuery = query;
        state.currentPage = 1;
        state.currentCategory = "";
        state.currentFilter = "";
        state.viewMode = "normal";
        document.getElementById("sectionTitle").textContent = "搜索: " + query;
        renderCategoryChips();
        renderFilterChips();
        loadVideoList();
      }

      function setupUI() {
        renderCategoryChips();
        renderFilterChips();

        var searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            searchInput.blur();
            performSearch();
          }
        });
        var searchBtn = document.getElementById("searchBtn");
        searchBtn.addEventListener("click", function () {
          performSearch();
        });

        var actorSearchInput = document.getElementById("actorSearchInput");
        actorSearchInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            actorSearchInput.blur();
            performActorSearch();
          }
        });
        var actorSearchBtn = document.getElementById("actorSearchBtn");
        actorSearchBtn.addEventListener("click", function () {
          performActorSearch();
        });

        if (state.isTV) {
          searchInput.setAttribute("readonly", "true");
          searchInput.addEventListener("focus", function () {
            searchInput.removeAttribute("readonly");
          });
          searchInput.addEventListener("blur", function () {
            searchInput.setAttribute("readonly", "true");
          });
        }

        var detailBack = document.getElementById("detailBack");
        detailBack.addEventListener("click", function () {
          closeDetail();
        });

        window.addEventListener("popstate", function (e) {
          if (document.body.classList.contains("detail-active")) {
            closeDetail();
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" || e.key === "Backspace") {
            if (document.body.classList.contains("detail-active")) {
              e.preventDefault();
              closeDetail();
            }
          }
        });

        overlay = document.getElementById('cookieOverlay');
        input = document.getElementById('cookieInput');
        saveBtn = document.getElementById('cookieSave');
        clearBtn = document.getElementById('cookieClear');
        closeBtn = document.getElementById('cookieClose');
        triggerBtn = document.getElementById('cookieTrigger');

        if (triggerBtn) {
          triggerBtn.addEventListener('click', openCookieModal);
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', closeCookieModal);
        }
        if (overlay) {
          overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeCookieModal();
          });
        }
        if (saveBtn) {
          saveBtn.addEventListener('click', function() {
            var val = input.value.trim();
            setManualCookie(val);
            closeCookieModal();
            toast('Cookie 已保存');
            loadVideoList();
          });
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', function() {
            setManualCookie('');
            input.value = '';
            closeCookieModal();
            toast('Cookie 已清除');
            loadVideoList();
          });
        }

        document.getElementById("sectionTitle").textContent = state.currentQuery ? "搜索: " + state.currentQuery : "热播";
        loadVideoList();
      }

      function detectTV() {
        if (window.fongmiClient && window.fongmiClient.isLeanback) {
          state.isTV = true;
          document.documentElement.classList.add("tv-mode");
        }
        if (window.innerWidth > 960 && window.innerWidth / window.innerHeight > 1.3) {
          state.isTV = true;
          document.documentElement.classList.add("tv-mode");
        }
      }

      function init() {
        detectTV();
        if (window.fongmiBridge) {
          document.documentElement.classList.add("fm-native");
          document.documentElement.classList.add("native-phone-app");
        }
        waitForSdk(2000).then(function (ready) {
          if (ready && sdk() && sdk().ui && sdk().ui.setChrome) {
            try {
              sdk().ui.setChrome({
                mode: "edge",
                statusBarStyle: "light",
                navigationBarStyle: "light",
                startup: true
              });
            } catch (e) {}
          }
          if (location.hash && location.hash.indexOf("detail=") === 1) {
            var vidFromHash = location.hash.split("detail=")[1].split("&")[0];
            if (vidFromHash) {
              openDetail(decodeURIComponent(vidFromHash), "", "");
              return;
            }
          }
          setupUI();
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
